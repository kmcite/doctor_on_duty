name: doctor_on_duty

description: new app
publish_to: "none"
version: 2.0.0+2
environment:
  sdk: ^3.10.3
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  path_provider: ^2.1.0  
  uuid: ^4.4.0
  file_picker: 
  material_design_icons_flutter: any
  font_awesome_flutter: ^10.7.0
  colornames:
  english_words: any
  google_fonts: ^8.0.1
  package_info_plus: ^9.0.0
  permission_handler: ^12.0.0+1
  objectbox: ^5.1.0
  objectbox_flutter_libs: ^5.1.0
  states_rebuilder: ^6.4.0
  faker: ^2.2.0
  forui: ^0.18.1
  path: ^1.9.1
  flutter_native_splash: ^2.4.7
  yaru: ^9.0.0
  intl:
  redux: ^5.0.0
  flutter_redux: ^0.10.0
dev_dependencies: 
  objectbox_generator: ^5.1.0
  build_runner: ^2.10.4
  flutter_lints: ^6.0.0
  flutter_launcher_icons: 
flutter:
  uses-material-design: true
  fonts:
    - family: Operator Mono
      fonts:
        - asset: assets/operator.otf
    - family: Lotion
      fonts:
        - asset: assets/Lotion-Black.ttf
        - asset: assets/Lotion-BlackItalic.ttf
          style: italic
        - asset: assets/Lotion-Bold.ttf
        - asset: assets/Lotion-BoldItalic.ttf
          style: italic
        - asset: assets/Lotion-Regular.ttf
        - asset: assets/Lotion-RegularItalic.ttf
          style: italic
        - asset: assets/Lotion-SemiBold.ttf
        - asset: assets/Lotion-SemiBoldItalic.ttf
          style: italic

  assets:
    - assets/
    - assets/fonts/

flutter_native_splash:
  image: "assets/book.png"
  color: "#000000"
  background_image: "assets/default.png"
flutter_launcher_icons:
  android: "launcher_icon"
  # ios: true
  image_path: "assets/book.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  web:
    generate: true
    image_path: "assets/book.png"
    # background_color: "#hexcode"
    # theme_color: "#hexcode"
  windows:
    generate: true
    image_path: "assets/book.png"
    icon_size: 72 # min:48, max:256, default: 48
  macos:
    generate: true
    image_path: "assets/book.png"
# dart run flutter_native_splash:create
# dart run flutter_launcher_icons
