name: doctor_on_duty

description: new app
publish_to: "none"
version: 2.0.0+2
environment:
  sdk: ^3.13.0
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^2.0.0
  provider: ^6.1.5
  path_provider: ^2.1.0
  uuid: ^4.4.0
  package_info_plus: ^10.2.0
  objectbox: ^6.0.0-preview.6
  objectbox_flutter_libs: ^6.0.0-preview.6
  path: ^1.9.1
  intl:
  image_picker: ^1.2.4
  shared_preferences: ^2.5.6
dev_dependencies:
  objectbox_generator: ^6.0.0-preview.6
  build_runner: ^2.10.4
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7
flutter:
  uses-material-design: true
  fonts:
    - family: Operator Mono
      fonts:
        - asset: assets/operator.otf
    - family: Lotion
      fonts:
        - asset: assets/Lotion-Black.ttf
        - asset: assets/Lotion-BlackItalic.ttf
          style: italic
        - asset: assets/Lotion-Bold.ttf
        - asset: assets/Lotion-BoldItalic.ttf
          style: italic
        - asset: assets/Lotion-Regular.ttf
        - asset: assets/Lotion-RegularItalic.ttf
          style: italic
        - asset: assets/Lotion-SemiBold.ttf
        - asset: assets/Lotion-SemiBoldItalic.ttf
          style: italic

  assets:
    - assets/
    - assets/fonts/

flutter_native_splash:
  color: "#070B12"
  image: assets/branding/app_icon_duotone.png
  background_image: assets/branding/splash_duotone.png
  android_12:
    color: "#070B12"
    image: assets/branding/app_icon_duotone.png
  android_gravity: center
  ios_content_mode: center
  web: false
flutter_launcher_icons:
  android: launcher_icon
  image_path: assets/branding/app_icon_duotone.png
  adaptive_icon_background: "#0C1524"
  adaptive_icon_foreground: assets/branding/app_icon_duotone.png
  min_sdk_android: 21
  web:
    generate: true
    image_path: assets/branding/app_icon_duotone.png
    background_color: "#070B12"
    theme_color: "#0D9488"
  windows:
    generate: true
    image_path: assets/branding/app_icon_duotone.png
    icon_size: 256
  macos:
    generate: true
    image_path: assets/branding/app_icon_duotone.png
